name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download self-hosted fonts
        # Same fonts as deploy.yml: binary WOFF2 files are not stored in
        # the repo, so CI fetches the latin subsets from Google Fonts.
        # They land in src/assets/fonts so Vite bundles them.
        run: |
          mkdir -p src/assets/fonts
          curl -fsSL -o src/assets/fonts/Archivo.woff2 "https://fonts.gstatic.com/s/archivo/v25/k3kPo8UDI-1M0wlSV9XAw6lQkqWY8Q82sLydOxI.woff2"
          curl -fsSL -o src/assets/fonts/ArchivoBlack-400.woff2 "https://fonts.gstatic.com/s/archivoblack/v23/HTxqL289NzCGg4MzN6KJ7eW6CYyF_g.woff2"
          curl -fsSL -o src/assets/fonts/JetBrainsMono.woff2 "https://fonts.gstatic.com/s/jetbrainsmono/v24/tDbV2o-flEEny0FZhsfKu5WU4xD7OwE.woff2"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
