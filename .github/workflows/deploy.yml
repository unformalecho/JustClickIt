name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download self-hosted fonts
        # Binary WOFF2 files are not stored in the repo; CI fetches the
        # latin subsets from Google Fonts so the deployed site stays
        # self-hosted (no Google Fonts requests at runtime). They land in
        # src/assets/fonts so Vite bundles them (hashed, base-aware).
        run: |
          mkdir -p src/assets/fonts
          curl -fsSL -o src/assets/fonts/Archivo.woff2 "https://fonts.gstatic.com/s/archivo/v25/k3kPo8UDI-1M0wlSV9XAw6lQkqWY8Q82sLydOxI.woff2"
          curl -fsSL -o src/assets/fonts/ArchivoBlack-400.woff2 "https://fonts.gstatic.com/s/archivoblack/v23/HTxqL289NzCGg4MzN6KJ7eW6CYyF_g.woff2"
          curl -fsSL -o src/assets/fonts/JetBrainsMono.woff2 "https://fonts.gstatic.com/s/jetbrainsmono/v24/tDbV2o-flEEny0FZhsfKu5WU4xD7OwE.woff2"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
