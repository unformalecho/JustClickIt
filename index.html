<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="JustClickIt — one giant button, nine tiny distractions. Click it and take whatever the boredom gods hand you."
    />
    <link rel="icon" href="data:," />
    <title>JustClickIt — Click. Play. Stop Being Bored.</title>
  </head>
  <body>
    <main class="wrap">
      <header class="app-header">
        <button
          class="btn ghost hbtn is-hidden"
          id="backBtn"
          type="button"
          aria-label="Back to previous view"
        >
          ← Back
        </button>
        <span class="view-title" id="viewTitle" tabindex="-1"></span>
        <button
          class="btn ghost hbtn"
          id="moreBtn"
          type="button"
          aria-label="More"
          aria-haspopup="menu"
          aria-expanded="false"
        >
          ⋯
        </button>
      </header>
      <div id="view"></div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
